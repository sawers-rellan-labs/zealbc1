# Alignment + calling env (small, compatible tools share one env).
# minibwa: lh3's BWA successor, ~2-3x faster than bwa-mem2, paired-end; on bioconda.
channels:
  - conda-forge
  - bioconda
dependencies:
  - minibwa=0.7
  - samtools=1.21
  - bcftools=1.21
  - htslib=1.21
  - cutadapt=4.9      # inline-inline demux (exact match, -Z fast gzip)
  - pysam=0.22        # read_mixing (QC set) + per-read BAM walks
  - wgsim             # read simulation (QC set)
